name: fast
manifest_path: data/processed/manifest.json
checkpoint_dir: checkpoints
checkpoint_name: fast.pt

mlflow_tracking_uri: file:./mlruns
mlflow_experiment_name: terratrace

device: auto
seed: 42

epochs: 25
batch_size: 8
num_workers: 0

model:
  in_channels: 4
  base_channels: 24
  depth: 4

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

loss:
  dice_weight: 0.6
  bce_weight: 0.4
  pos_weight: 5.0

augment_train: true
log_every: 5
