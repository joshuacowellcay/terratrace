# Optional containerised dev: brings up backend + frontend together.
# The canonical, must-work setup path is the venv + npm one documented in README.md;
# Docker is provided for one-command runs and CI parity.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - TERRATRACE_FORCE_SYNTHETIC=1   # default to the offline-safe path
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
